  <!-- bolsa (e-commerce) -->
  <path d="M22 27h20a3 3 0 0 1 3 3v14a6 6 0 0 1-6 6H25a6 6 0 0 1-6-6V30a3 3 0 0 1 3-3z" fill="#FFFFFF"/>
  <!-- manija -->
