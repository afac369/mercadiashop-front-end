  <!-- pequeños “circuits” -->
  <g stroke="#7C3AED" stroke-width="2">
    <circle cx="28" cy="38" r="2" fill="#7C3AED"/>
    <circle cx="36" cy="38" r="2" fill="#7C3AED"/>
    <path d="M30 38h4" />
